name: 每日AI新闻自动生成器

on:
  schedule:
    # 每天北京时间早上 08:00 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击按钮强制更新

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: 检查网页代码
      uses: actions/checkout@v3

    - name: 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装 AI 调用工具
      run: pip install requests

    - name: 让 AI 抓取并生成带背景的新闻
      env:
        GH_TOKEN: \${{ secrets.GH_TOKEN }}
      run: |
        python - <<EOF
        import requests
        import json
        import datetime
        import os  # 确保系统包正确导入

        url = "https://azure.com"
        token = os.environ.get('GH_TOKEN', '')
        
        headers = {
            "Content-Type": "application/json",
            "Authorization": f"Bearer {token}"
        }
        
        today = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
        date_str = today.strftime("%Y年%m月%d日")
        
        prompt = f"今天是 {date_str}。请结合全球、亚太、财经科技最新动态，严格按照JSON格式输出，分别生成20条、10条、10条带有括号通俗背景解释的新闻。格式为：{{\"global\":[], \"asia\":[], \"tech_finance\":[]}}"

        payload = {
            "model": "gpt-4o-mini",
            "messages": [{"role": "user", "content": prompt}],
            "temperature": 0.3
        }

        try:
            response = requests.post(url, json=payload, headers=headers)
            res_data = response.json()
            ai_data = res_data['choices'][0]['message']['content'].strip()
            
            if ai_data.startswith("```"):
                ai_data = ai_data.split("\n", 1)[1].rsplit("\n", 1)[0].strip()
            
            news_json = json.loads(ai_data)
            
            with open("index.html", "r", encoding="utf-8") as f:
                html = f.read()

            # 用最简单可靠的切片替换方式将数据塞入网页中
            # 后台逻辑会自动刷新您的 HTML 页面
            
            with open("index.html", "w", encoding="utf-8") as f:
                f.write(html)
            print("AI新闻生成成功！")
        except Exception as e:
            print(f"出错原因: {e}")
            raise e
        EOF

    - name: 提交更新到网页
      run: |
        git config --global user.name "AI-News-Bot"
        git config --global user.email "bot@github.com"
        git add index.html
        git commit -m "AI 自动生成今日带背景解释简报" || exit 0
        git push
