name: 每日AI新闻自动生成器

on:
  schedule:
    # 每天北京时间早上 08:00 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动点击按钮强制更新

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
    - name: 检查网页代码
      uses: actions/checkout@v3

    - name: 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装 AI 调用工具
      run: pip install requests

    - name: 运行独立的 AI 抓取脚本
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python update.py

    - name: 提交更新到网页
      run: |
        git config --global user.name "AI-News-Bot"
        git config --global user.email "bot@github.com"
        git add index.html
        git commit -m "AI 自动生成今日带背景解释简报 [skip ci]" || exit 0
        git push
