        function renderNews(category) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';
            
            newsData[category].forEach((news, index) => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex space-x-3 items-start hover:border-indigo-100 transition-all active:scale-[0.99]";
                card.innerHTML = `
                    <span class="bg-slate-100 text-slate-500 text-xs font-bold px-2 py-0.5 rounded-lg mt-0.5">
                        ${String(index + 1).padStart(2, '0')}
                    </span>
                    <p class="text-[14px] text-slate-800 leading-relaxed font-normal">${news}</p>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(category) {
            const tabs = ['global', 'asia', 'tech-finance'];
            tabs.forEach(cat => {
                const tab = document.getElementById(`tab-${cat}`);
                if(cat === category) {
                    tab.className = "flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white shadow-sm transition-all";
                } else {
                    tab.className = "flex-shrink-0 px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 transition-all";
                }
            });
            renderNews(category);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
